<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shampoore Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --md-sys-color-background: #121212;
  --md-sys-color-surface: #1e1e1e;
  --md-sys-color-surface-variant: #2d2d2d;
  --md-sys-color-primary: #90caf9;
  --md-sys-color-on-primary: #000000;
  --md-sys-color-secondary: #b0bec5;
  --md-sys-color-error: #f44336;
  --md-sys-color-success: #4caf50;
  --md-sys-color-warning: #ffb74d;
  --md-sys-color-on-surface: #e0e0e0;
  --md-sys-color-on-surface-variant: #9e9e9e;
  --md-sys-color-outline: #49454f;
  
  --md-elevation-1: 0px 1px 3px 1px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
  --md-elevation-2: 0px 2px 6px 2px rgba(0,0,0,0.15), 0px 1px 2px 0px rgba(0,0,0,0.30);
  --md-elevation-3: 0px 4px 8px 3px rgba(0,0,0,0.15), 0px 1px 3px 0px rgba(0,0,0,0.30);
  
  --md-radius-s: 8px;
  --md-radius-m: 12px;
  --md-radius-l: 16px;
  --md-radius-xl: 24px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', system-ui, -apple-system, sans-serif;
  background-color: var(--md-sys-color-background);
  color: var(--md-sys-color-on-surface);
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: 0.1px; }
h2 { font-size: 16px; font-weight: 500; margin: 0 0 16px; color: var(--md-sys-color-on-surface-variant); letter-spacing: 0.15px; }
p { margin: 0; font-size: 14px; color: var(--md-sys-color-on-surface-variant); }

header {
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background-color: var(--md-sys-color-background);
  z-index: 10;
  box-shadow: 0px 2px 4px -1px rgba(0,0,0,0.2);
}

main {
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
}

.server-bar {
  background-color: var(--md-sys-color-surface);
  border-radius: var(--md-radius-l);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--md-elevation-1);
  flex-wrap: wrap;
  gap: 16px;
  border: 1px solid var(--md-sys-color-outline);
}
.server-status-text {
  font-weight: 500;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
}
.dot.ok { background-color: var(--md-sys-color-success); box-shadow: 0 0 8px var(--md-sys-color-success); }
.dot.err { background-color: var(--md-sys-color-error); box-shadow: 0 0 8px var(--md-sys-color-error); }

.card {
  background-color: var(--md-sys-color-surface);
  border-radius: var(--md-radius-l);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--md-elevation-1);
  transition: box-shadow 0.3s ease;
}
.card:hover {
  box-shadow: var(--md-elevation-2);
}
.card h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 500;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  word-break: break-word;
}
.card-meta {
  font-size: 13px;
  color: var(--md-sys-color-on-surface-variant);
  background: var(--md-sys-color-surface-variant);
  padding: 4px 8px;
  border-radius: var(--md-radius-s);
  display: inline-block;
}
.card-error {
  color: var(--md-sys-color-error);
  font-size: 13px;
  background: rgba(244, 67, 54, 0.1);
  padding: 8px;
  border-radius: var(--md-radius-s);
  word-break: break-all;
}

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px 10px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.chip.running { background-color: rgba(76, 175, 80, 0.2); color: #81c784; }
.chip.stopped { background-color: rgba(158, 158, 158, 0.2); color: #e0e0e0; }
.chip.error { background-color: rgba(244, 67, 54, 0.2); color: #e57373; }
.chip.starting { background-color: rgba(255, 152, 0, 0.2); color: #ffb74d; }

button {
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.1px;
  border: none;
  border-radius: var(--md-radius-s);
  padding: 10px 20px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  outline: none;
  height: 40px;
  flex-shrink: 0;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }

button.filled {
  background-color: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
}
button.filled:hover { background-color: #a7d4f7; box-shadow: var(--md-elevation-1); }
button.filled.danger { background-color: var(--md-sys-color-error); color: white; }
button.filled.danger:hover { background-color: #e57373; }
button.filled.success { background-color: var(--md-sys-color-success); color: white; }
button.filled.success:hover { background-color: #81c784; }

button.outlined {
  background-color: transparent;
  color: var(--md-sys-color-primary);
  border: 1px solid var(--md-sys-color-outline);
}
button.outlined:hover { background-color: rgba(144, 202, 249, 0.08); }

button.icon {
  padding: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface);
  transition: background 0.2s, color 0.2s;
}
button.icon:hover {
  background: #444;
  color: var(--md-sys-color-primary);
}
button.icon.danger:hover {
  background: rgba(244, 67, 54, 0.2);
  color: var(--md-sys-color-error);
}
button.icon svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.actions { 
  display: flex; 
  gap: 8px; 
  align-items: center;
  margin-top: auto; 
  padding-top: 16px;
  flex-wrap: wrap;
}
.actions .spacer { flex-grow: 1; }

.warning-banner {
  background: rgba(255, 183, 77, 0.15);
  color: var(--md-sys-color-warning);
  border: 1px solid rgba(255, 183, 77, 0.3);
  padding: 12px 16px;
  border-radius: var(--md-radius-s);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}
.warning-banner svg { width: 18px; height: 18px; fill: currentColor; }

.lang-select {
  background-color: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface);
  border: none;
  border-radius: 16px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  outline: none;
  appearance: none;
  background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239e9e9e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  background-repeat: no-repeat;
  background-position: right 12px top 50%;
  background-size: 10px auto;
  padding-right: 32px;
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-bg.show {
  opacity: 1;
  pointer-events: auto;
}
.modal {
  background-color: var(--md-sys-color-surface);
  border-radius: var(--md-radius-xl);
  padding: 24px;
  width: 100%;
  max-width: 780px;
  max-height: 90vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: var(--md-elevation-3);
  transform: scale(0.95);
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal-bg.show .modal {
  transform: scale(1);
}
.modal h2 { margin: 0; font-size: 24px; color: var(--md-sys-color-on-surface); }

label {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
label span {
  font-size: 12px;
  font-weight: 500;
  color: var(--md-sys-color-on-surface-variant);
  letter-spacing: 0.5px;
}
input[type="text"], textarea {
  width: 100%;
  background-color: var(--md-sys-color-background);
  border: 1px solid var(--md-sys-color-outline);
  border-radius: var(--md-radius-s);
  padding: 12px 16px;
  color: var(--md-sys-color-on-surface);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s ease;
}
input[type="text"]:focus, textarea:focus {
  border-color: var(--md-sys-color-primary);
  box-shadow: 0 0 0 1px var(--md-sys-color-primary);
}
textarea {
  font-family: 'SF Mono', 'Roboto Mono', Consolas, monospace;
  min-height: 300px;
  line-height: 1.5;
  resize: vertical;
}

.tpl-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 4px;
}
.tpl-bar button {
  border-radius: var(--md-radius-s);
  padding: 8px 12px;
  height: auto;
  font-size: 13px;
  background: var(--md-sys-color-surface-variant);
  color: var(--md-sys-color-on-surface);
  border: 1px solid var(--md-sys-color-outline);
}
.tpl-bar button:hover {
  background: #3d3d3d;
  border-color: var(--md-sys-color-primary);
}

.logs {
  background-color: #000;
  border-radius: var(--md-radius-s);
  padding: 16px;
  max-height: 60vh;
  overflow: auto;
  font-family: 'SF Mono', 'Roboto Mono', Consolas, monospace;
  font-size: 13px;
  color: #a9b7c6;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.4;
}

#snackbar {
  visibility: hidden;
  min-width: 250px;
  background-color: #333;
  color: #fff;
  text-align: center;
  border-radius: 4px;
  padding: 14px;
  position: fixed;
  z-index: 1000;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  font-size: 14px;
  box-shadow: var(--md-elevation-2);
  opacity: 0;
  transition: opacity 0.3s, bottom 0.3s;
}
#snackbar.show {
  visibility: visible;
  opacity: 1;
  bottom: 50px;
}

.status-line { font-size: 13px; font-weight: 500; min-height: 20px; display: flex; align-items: center; gap: 6px; }
.status-line.ok { color: var(--md-sys-color-success); }
.status-line.err { color: var(--md-sys-color-error); }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px 24px;
  background: var(--md-sys-color-surface);
  border-radius: var(--md-radius-l);
  border: 2px dashed var(--md-sys-color-outline);
  color: var(--md-sys-color-on-surface-variant);
  font-size: 15px;
  text-align: center;
  gap: 16px;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Shampoore Panel</h1>
  <div style="display:flex;align-items:center;gap:16px">
    <div id="status" style="font-size:14px;font-weight:500;color:var(--md-sys-color-on-surface-variant)">…</div>
    <select id="lang-switch" class="lang-select" onchange="changeLang(this.value)">
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="eo">Esperanto</option>
    </select>
  </div>
</header>

<main>
  <!-- Глобальный статус сервера -->
  <div id="server-bar" class="server-bar"></div>

  <section>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 id="lbl-configs" style="margin:0;">Configurations</h2>
      <div style="display:flex; gap:8px;">
        <button class="filled" onclick="openAdd()" id="btn-add">+ Add Config</button>
        <button class="outlined" onclick="load()" id="btn-refresh">↻ Refresh</button>
      </div>
    </div>
    
    <div id="configs" class="grid"></div>
    <div id="empty" class="empty hidden"></div>
  </section>
</main>

<div id="modal-bg" class="modal-bg hidden"></div>
<div id="snackbar"></div>

<script>

    noActiveConfigs: "Сервер запущен, но ни один конфиг не включен.",
  },

    btnExport: "Eksporti",

    nameLabel: "Nomo (a-zA-Z0-9_-; laŭvola)",

    noActiveConfigs: "Servilo funkcias sed neniu agordo estas ŝaltita.",
  }
};

let currentLang = localStorage.getItem('shampoore_lang') || 'en';
function t(key) { return i18n[currentLang][key] || key; }

function changeLang(lang) {
  currentLang = lang;
  localStorage.setItem('shampoore_lang', lang);
  applyTranslations();
  load();
}

function applyTranslations() {
  document.getElementById('lang-switch').value = currentLang;
  document.getElementById('btn-add').innerHTML = t('addConfig');
  document.getElementById('btn-refresh').innerHTML = t('refresh');
  document.getElementById('lbl-configs').innerText = t('configurations');
  renderServerBar();
}

function showSnackbar(msg) {
  const sb = document.getElementById('snackbar');
  sb.innerText = msg;
  sb.className = 'show';
  setTimeout(() => { sb.className = sb.className.replace('show', ''); }, 3000);
}

const params = new URLSearchParams(location.search);
if (params.get('token')) localStorage.setItem('shampoore_token', params.get('token'));
const TOKEN = localStorage.getItem('shampoore_token') || '';

const state = { templates: [], configs: [], serverRunning: false };

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers || {});
  if (TOKEN) opts.headers['X-Panel-Token'] = TOKEN;
  const res = await fetch(path, opts);
  const text = await res.text();
  let body = {};
  try { body = text ? JSON.parse(text) : {}; } catch (_) { body = { error: text }; }
  if (!res.ok) {
    const err = new Error(body.error || res.statusText || 'request failed');
    err.status = res.status;
    throw err;
  }
  return body;
}

async function load() {
  const statusEl = document.getElementById('status');
  try {
    if (!state.templates.length) {
      try { state.templates = await api('/api/templates') || []; } catch (_) {}
    }
    const sst = await api('/api/server/status');
    state.serverRunning = sst.running;
    renderServerBar();
    
    state.configs = await api('/api/configs') || [];
    render();
    
    if (state.serverRunning) {
      statusEl.innerHTML = `<span class="dot ok"></span> ${t('serverRunning')}`;
    } else {
      statusEl.innerHTML = `<span class="dot err"></span> ${t('serverStopped')}`;
    }
  } catch (e) {
    statusEl.innerHTML = `<span class="dot err"></span> ${t('offline')}`;
    renderServerBar();
  }
}

function renderServerBar() {
  const bar = document.getElementById('server-bar');
  if (state.serverRunning) {
    bar.innerHTML = `
      <div class="server-status-text"><span class="dot ok"></span> ${t('serverRunning')}</div>
      <div style="display:flex; gap:8px">
        <button class="outlined" onclick="openServerLogs()">${t('btnServerLogs')}</button>
        <button class="filled danger" onclick="stopServer()">${t('btnStopServer')}</button>
      </div>
    `;
  } else {
    bar.innerHTML = `
      <div class="server-status-text"><span class="dot err"></span> ${t('serverStopped')}</div>
      <div style="display:flex; gap:8px">
        <button class="outlined" onclick="openServerLogs()">${t('btnServerLogs')}</button>
        <button class="filled success" onclick="startServer()">${t('btnStartServer')}</button>
      </div>
    `;
  }
}

async function startServer() {
  try {
    await api('/api/server/start', { method: 'POST' });
    setTimeout(load, 1000);
  } catch (e) { showSnackbar(e.message); }
}

async function stopServer() {
  if (!confirm(t('confirmStopServer'))) return;
  try {
    await api('/api/server/stop', { method: 'POST' });
    setTimeout(load, 500);
  } catch (e) { showSnackbar(e.message); }
}

async function openServerLogs() {
  try {
    const d = await api('/api/server/logs?limit=1000');
    const lines = d.lines || [];
    showModal(`
      <h2>${t('btnServerLogs')}</h2>
      <div class="logs">${esc(lines.join('\n')) || '(empty)'}</div>
      <div class="actions" style="justify-content:flex-end">
        <button class="filled" onclick="closeModal()">${t('btnClose')}</button>
      </div>`);
  } catch (e) { showSnackbar(e.message); }
}

function render() {
  const root = document.getElementById('configs');
  const empty = document.getElementById('empty');
  if (!state.configs.length) {
    root.innerHTML = '';
    empty.classList.remove('hidden');
    empty.innerHTML = `<p>${t('emptyList')}</p>`;
    return;
  }
  empty.classList.add('hidden');
  
  root.innerHTML = state.configs.map(c => {
    const n = escAttr(c.name);
    const running = c.status === 'running' || c.status === 'starting';

    const primary = c.enabled
      ? `<button class="filled danger" onclick="stopCfg('${n}')">${t('btnStop')}</button>`
      : `<button class="filled success" onclick="startCfg('${n}')">${t('btnStart')}</button>`;

    const iconRestart = `<svg viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>`;
    const iconLogs = `<svg viewBox="0 0 24 24"><path d="M4 17l6-6-6-6"></path><path d="M12 19h8"></path></svg>`;
    const iconEdit = `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
    const iconTrash = `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
    const iconWarn = `<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;

    return `
      <div class="card">
        <h3>
          <span>${esc(c.name)}</span>
          <span class="chip ${c.status}">${esc(c.status)}</span>
        </h3>
        <div>
          <span class="card-meta">${esc(c.kind || '—')}</span>
        </div>
        ${c.error ? `<div class="card-error">${esc(c.error)}</div>` : ''}
        
        ${!state.serverRunning && c.enabled ? `<div class="warning-banner">${iconWarn} ${t('warningServerOff')}</div>` : ''}

        <div class="actions">
          ${primary}
          <button class="outlined" onclick="exportCfg('${n}')" style="padding: 0 16px">${t('btnExport')}</button>
          <div class="spacer"></div>
          <button class="icon" title="${t('btnRestart')}" onclick="restartCfg('${n}')">${iconRestart}</button>
          <button class="icon" title="${t('btnLogs')}" onclick="openLogs('${n}')">${iconLogs}</button>
          <button class="icon" title="${t('btnEdit')}" onclick="openEdit('${n}')">${iconEdit}</button>
          <button class="icon danger" title="${t('btnDelete')}" onclick="del('${n}')">${iconTrash}</button>
        </div>
      </div>`;
  }).join('');
}

async function startCfg(name) {
  try {
    await api(`/api/configs/${encodeURIComponent(name)}/enable`, { method: 'POST' });
    await load();
  } catch (e) { showSnackbar(e.message); }
}

async function stopCfg(name) {
  try {
    await api(`/api/configs/${encodeURIComponent(name)}/disable`, { method: 'POST' });
    await load();
  } catch (e) { showSnackbar(e.message); }
}

async function restartCfg(name) {
  try {
    await api(`/api/configs/${encodeURIComponent(name)}/restart`, { method: 'POST' });
    await load();
  } catch (e) { showSnackbar(e.message); }
}

async function exportCfg(name) {
  try {
    const d = await api(`/api/configs/${encodeURIComponent(name)}/export`);
    await navigator.clipboard.writeText(d.url);
    showSnackbar(t('copySuccess'));
  } catch (e) {
    showSnackbar("Clipboard error: " + e.message);
  }
}

async function del(name) {
  if (!confirm(t('confirmDelete'))) return;
  try {
    await api(`/api/configs/${encodeURIComponent(name)}`, { method: 'DELETE' });
    await load();
  } catch (e) { showSnackbar(e.message); }
}

function openAdd() {
  const tplButtons = state.templates.length 
    ? state.templates.map(t => `
        <button type="button" onclick="loadTpl('${escAttr(t.id)}')" title="${escAttr(t.description || '')}">
          ${esc(t.display_name)}
        </button>`).join('')
    : '<span style="color:var(--md-sys-color-error);font-size:12px">Templates not found (check examples dir)</span>';

  showModal(`
    <h2>${t('newConfigTitle')}</h2>
    <label>
      <span>${t('nameLabel')}</span>
      <input id="add-name" type="text" placeholder="meeting-1" pattern="[a-zA-Z0-9_-]*" autocomplete="off">
    </label>
    <div>
      <span style="display:block;font-size:12px;font-weight:500;color:var(--md-sys-color-on-surface-variant);margin-bottom:8px">
        ${t('loadTemplate')}
      </span>
      <div class="tpl-bar">
        ${tplButtons}
        <button type="button" onclick="loadBlank()">${t('emptyBtn')}</button>
      </div>
    </div>
    <label>
      <span>${t('jsonLabel')}</span>
      <textarea id="add-json" spellcheck="false" placeholder="..."></textarea>
    </label>
    <div id="add-status" class="status-line"></div>
    <div class="actions" style="justify-content:flex-end; margin-top:8px;">
      <button class="outlined" onclick="closeModal()">${t('btnCancel')}</button>
      <button class="filled" onclick="submitAdd()">${t('btnCreate')}</button>
    </div>`);
    
  const ta = document.getElementById('add-json');
  let validateTimer = null;
  ta.addEventListener('input', () => {
    const st = document.getElementById('add-status');
    st.textContent = t('statusChecking');
    st.className = 'status-line';
    clearTimeout(validateTimer);
    validateTimer = setTimeout(validateAdd, 500);
  });
}

function loadBlank() {
  document.getElementById('add-json').value = '';
  document.getElementById('add-status').textContent = '';
  document.getElementById('add-status').className = 'status-line';
}

function loadTpl(id) {
  const t = state.templates.find(x => x.id === id);
  if (!t) return;
  document.getElementById('add-json').value = t.example || '';
  const nameEl = document.getElementById('add-name');
  if (!nameEl.value.trim()) {
    nameEl.value = id + '-' + Math.random().toString(36).slice(2, 6);
  }
  validateAdd();
}

async function validateAdd() {
  const content = document.getElementById('add-json').value.trim();
  const st = document.getElementById('add-status');
  if (!content) {
    st.textContent = '';
    st.className = 'status-line';
    return;
  }
  try {
    const r = await api('/api/configs/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (r.ok) {
      st.textContent = `✓ ${r.type}${r.is_url ? ' (URL)' : ''}` +
        (r.name ? ` · name: ${r.name}` : '');
      st.className = 'status-line ok';
      const nameEl = document.getElementById('add-name');
      if (!nameEl.value.trim() && r.name) nameEl.value = r.name;
    } else {
      st.textContent = '✗ ' + (r.error || t('statusInvalid'));
      st.className = 'status-line err';
    }
  } catch (e) {
    st.textContent = '✗ ' + e.message;
    st.className = 'status-line err';
  }
}

async function submitAdd() {
  const name = document.getElementById('add-name').value.trim();
  const content = document.getElementById('add-json').value.trim();
  const st = document.getElementById('add-status');
  if (!content) {
    st.textContent = '✗ empty';
    st.className = 'status-line err';
    return;
  }
  let template = '';
  try {
    const parsed = JSON.parse(content);
    const t = state.templates.find(x => x.kind === parsed.type);
    if (t) template = t.id;
  } catch (_) {}
  try {
    await api('/api/configs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, template, content }),
    });
    closeModal();
    await load();
  } catch (e) {
    st.textContent = '✗ ' + e.message;
    st.className = 'status-line err';
  }
}

async function openEdit(name) {
  try {
    const c = await api(`/api/configs/${encodeURIComponent(name)}`);
    const settings = {...c.settings};
    delete settings.name;
    showModal(`
      <h2>${t('btnEdit')} ${esc(name)}</h2>
      <label>
        <span>Settings JSON</span>
        <textarea id="edit-json" spellcheck="false">${esc(JSON.stringify(settings, null, 2))}</textarea>
      </label>
      <div class="actions" style="justify-content:flex-end; margin-top:8px;">
        <button class="outlined" onclick="closeModal()">${t('btnCancel')}</button>
        <button class="filled" onclick="saveEdit('${escAttr(name)}')">${t('btnSave')}</button>
      </div>`);
  } catch (e) { showSnackbar(e.message); }
}

async function saveEdit(name) {
  try {
    const settings = JSON.parse(document.getElementById('edit-json').value);
    await api(`/api/configs/${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ settings }),
    });
    closeModal();
    await load();
  } catch (e) { showSnackbar(e.message); }
}

async function openLogs(name) {
  try {
    const d = await api(`/api/configs/${encodeURIComponent(name)}/logs?limit=500`);
    const lines = d.lines || [];
    showModal(`
      <h2>${t('logsTitle')} ${esc(name)}</h2>
      <div class="logs">${esc(lines.join('\n')) || '(empty)'}</div>
      <div class="actions" style="justify-content:flex-end; margin-top:8px;">
        <button class="filled" onclick="closeModal()">${t('btnClose')}</button>
      </div>`);
  } catch (e) { showSnackbar(e.message); }
}

function showModal(html) {
  const bg = document.getElementById('modal-bg');
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.classList.remove('hidden');
  setTimeout(() => bg.classList.add('show'), 10);
  bg.onclick = (e) => { if (e.target === bg) closeModal(); };
}

function closeModal() {
  const bg = document.getElementById('modal-bg');
  bg.classList.remove('show');
  setTimeout(() => {
    bg.classList.add('hidden');
    bg.innerHTML = '';
  }, 200);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escAttr(s) {
  return esc(s).replace(/\n/g, '\\n');
}

document.getElementById('lang-switch').value = currentLang;
applyTranslations();
load();
setInterval(load, 5000);
</script>
</body>
