<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shampoore Panel Login</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #101418;
    color: #e7edf3;
  }
  .card {
    width: min(420px, calc(100vw - 32px));
    padding: 32px;
    border-radius: 20px;
    background: #1b2229;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
  }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  p { margin: 0 0 24px; color: #9fb0c0; font-size: .92rem; line-height: 1.45; }
  label { display: block; margin-bottom: 8px; font-size: .85rem; color: #c8d5e2; }
  input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid #33414f;
    background: #11171d;
    color: inherit;
    font-size: 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  input:focus { outline: 2px solid #4c8dff; border-color: transparent; }
  button {
    width: 100%;
    height: 48px;
    margin-top: 20px;
    border: 0;
    border-radius: 12px;
    background: #4c8dff;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error {
    display: none;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #4a1f24;
    color: #ffb3bd;
    font-size: .88rem;
  }
  .error.show { display: block; }
  .hint { margin-top: 18px; margin-bottom: 0; font-size: .8rem; color: #7f8f9f; }
</style>
</head>
<body>
<main class="card">
  <h1>Shampoore Panel</h1>
  <p>Enter the panel access token. When the panel starts without <code>-token</code>, the generated token is printed in the panel log.</p>
  <form id="login-form" autocomplete="off">
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" spellcheck="false" autofocus required>
    <button id="submit" type="submit">Sign in</button>
    <div id="error" class="error" role="alert"></div>
  </form>
  <p class="hint">The token is stored only in an HttpOnly, SameSite=Strict cookie.</p>
</main>
<script>
(function () {
  const form = document.getElementById('login-form');
  const input = document.getElementById('token');
  const button = document.getElementById('submit');
  const error = document.getElementById('error');

  function showError(message) {
    error.textContent = message;
    error.classList.add('show');
  }

  function clearError() {
    error.textContent = '';
    error.classList.remove('show');
  }

  fetch('/api/server/status', { credentials: 'same-origin' })
    .then(function (res) { if (res.ok) window.location.replace('/'); })
    .catch(function () {});

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    clearError();
    const token = input.value.trim();
    if (!token) {
      showError('Token is required.');
      return;
    }
    button.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ token: token })
      });
      if (res.ok) {
        window.location.replace('/');
        return;
      }
      if (res.status === 429) {
        const retry = res.headers.get('Retry-After');
        showError(retry ? 'Too many attempts. Try again in ' + retry + ' seconds.' : 'Too many attempts. Try again later.');
        return;
      }
      showError(res.status === 401 ? 'Invalid token.' : 'Login failed (HTTP ' + res.status + ').');
    } catch (e) {
      showError('Cannot reach the panel: ' + e.message);
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
